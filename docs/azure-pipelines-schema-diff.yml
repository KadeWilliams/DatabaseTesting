# Reference pipeline — NOT wired into this repo's CI (this repo lives on
# GitHub; .github/workflows/pr-schema-diff.yml is the version that actually
# runs here, and every command in it was individually verified against real
# containers while building this repo). This file is the Azure DevOps
# translation of the same idea for adapting into an Azure Repos project.
# It has NOT been run against a real Azure DevOps org — treat it as a
# solid starting point, not a tested artifact, and expect to fix a few
# names/paths for your actual project layout.
#
# What it does, same as the GitHub version: build the PR branch's .dacpac
# and the target branch's .dacpac, publish the target branch's schema to a
# throwaway SQL Server container (standing in for "current schema"),
# generate — not run — the script that would take that baseline to the PR's
# schema, and post it as a comment on the PR.
#
# Before this will work:
#   1. Pipeline settings → enable "Allow scripts to access the OAuth token"
#      so $(System.AccessToken) can authenticate the PR-comment API call.
#   2. Confirm the Microsoft-hosted ubuntu-latest pool has Docker available
#      (it does by default) and that your org's agents aren't locked down
#      in a way that blocks pulling mcr.microsoft.com images.
#   3. Update the sqlproj path below if your solution layout differs.
#   4. This posts ONE new comment per run rather than updating a single
#      sticky comment (the GitHub version uses an action that does that;
#      the ADO REST API needs a bit more code to find-and-update an
#      existing thread — worth adding once you've got the basic version
#      working).

trigger: none

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/MyApplication.Database/*

pool:
  vmImage: ubuntu-latest

variables:
  SA_PASSWORD: "SchemaDiffPreview!CI"
  SQLPROJ_PATH: "src/MyApplication.Database/MyApplication.Database.sqlproj"

steps:
  - checkout: self
    fetchDepth: 0
    displayName: "Checkout PR branch"

  - script: |
      git clone --branch $(System.PullRequest.TargetBranch) --single-branch \
        "https://$(System.AccessToken)@dev.azure.com/$(System.TeamProject)/_git/$(Build.Repository.Name)" \
        "$(Agent.TempDirectory)/base-branch"
    displayName: "Checkout target branch for comparison"

  - task: UseDotNet@2
    inputs:
      version: "8.0.x"

  - script: dotnet tool install --global microsoft.sqlpackage
    displayName: "Install sqlpackage"

  - script: |
      dotnet build "$(Agent.TempDirectory)/base-branch/$(SQLPROJ_PATH)" -c Release -o "$(Agent.TempDirectory)/base-out"
    displayName: "Build target branch's .dacpac (comparison baseline)"

  - script: |
      dotnet build "$(SQLPROJ_PATH)" -c Release -o "$(Agent.TempDirectory)/pr-out"
    displayName: "Build this PR's .dacpac"

  - script: |
      docker run -d --name schema-diff-db -p 1433:1433 \
        -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$(SA_PASSWORD)" \
        mcr.microsoft.com/mssql/server:2022-latest
      for i in $(seq 1 40); do
        docker exec schema-diff-db /opt/mssql-tools18/bin/sqlcmd \
          -S localhost -U sa -P "$(SA_PASSWORD)" -C -N -Q "SELECT 1" && break
        sleep 3
      done
    displayName: "Start throwaway SQL Server container"

  - script: |
      sqlpackage /Action:Publish \
        /SourceFile:"$(Agent.TempDirectory)/base-out/MyApplication.Database.dacpac" \
        /TargetServerName:localhost /TargetDatabaseName:MyApplicationDb \
        /TargetUser:sa /TargetPassword:"$(SA_PASSWORD)" /TargetTrustServerCertificate:true
    displayName: "Publish target-branch schema as the baseline"

  - script: |
      sqlpackage /Action:Script \
        /SourceFile:"$(Agent.TempDirectory)/pr-out/MyApplication.Database.dacpac" \
        /TargetServerName:localhost /TargetDatabaseName:MyApplicationDb \
        /TargetUser:sa /TargetPassword:"$(SA_PASSWORD)" /TargetTrustServerCertificate:true \
        /OutputPath:"$(Build.ArtifactStagingDirectory)/schema-diff.sql"
    displayName: "Generate this PR's diff script"

  - publish: $(Build.ArtifactStagingDirectory)/schema-diff.sql
    artifact: schema-diff
    displayName: "Publish diff as a build artifact"
    condition: succeededOrFailed()

  - script: |
      DIFF_FILE="$(Build.ArtifactStagingDirectory)/schema-diff.sql"
      if [ ! -s "$DIFF_FILE" ]; then
        echo "No diff file produced, skipping comment."
        exit 0
      fi

      COMMENT_TEXT=$(printf '### Schema diff preview\n\nGenerated by `sqlpackage /Action:Script` against `%s`'"'"'s current schema. Not executed — review before merging.\n\n```sql\n%s\n```\n' \
        "$(System.PullRequest.TargetBranch)" "$(head -c 60000 "$DIFF_FILE")")

      jq -n --arg content "$COMMENT_TEXT" \
        '{comments: [{parentCommentId: 0, content: $content, commentType: 1}], status: 1}' \
        > "$(Agent.TempDirectory)/thread-body.json"

      curl -sS -X POST \
        -H "Authorization: Bearer $(System.AccessToken)" \
        -H "Content-Type: application/json" \
        -d @"$(Agent.TempDirectory)/thread-body.json" \
        "https://dev.azure.com/$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.Name)/pullRequests/$(System.PullRequest.PullRequestId)/threads?api-version=7.1"
    displayName: "Post diff as a PR comment"
    condition: succeededOrFailed()

  - script: docker rm -f schema-diff-db || true
    displayName: "Clean up the throwaway SQL Server container"
    condition: always()
