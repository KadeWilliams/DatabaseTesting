name: PR Schema Diff Preview

# Shows what deploying this PR's schema would actually do, before it's
# merged — the same idea as `terraform plan` on a PR. Builds the PR's
# .dacpac and the base branch's .dacpac, publishes the base one to a
# throwaway SQL Server service container (standing in for "current prod
# schema"), then asks sqlpackage to generate — not run — the script that
# would take that baseline to the PR's schema. Posted as a sticky PR
# comment so it's visible at review time, not just in a CI log.
#
# See docs/production-playbook.md for why this exists and what it caught
# the first time it ran for real (a temporal-table column that would have
# been blocked by sqlpackage's data-loss guard against a populated table).

on:
  pull_request:
    paths:
      - "src/MyApplication.Database/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  schema-diff:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "SchemaDiffPreview!CI"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P SchemaDiffPreview!CI -C -N -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: pr-branch

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-branch

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install sqlpackage
        run: dotnet tool install --global microsoft.sqlpackage

      - name: Build base branch's .dacpac (the comparison baseline)
        run: |
          dotnet build base-branch/src/MyApplication.Database/MyApplication.Database.sqlproj \
            -c Release -o base-out

      - name: Build this PR's .dacpac
        run: |
          dotnet build pr-branch/src/MyApplication.Database/MyApplication.Database.sqlproj \
            -c Release -o pr-out

      - name: Publish base schema to the service container
        env:
          SA_PASSWORD: SchemaDiffPreview!CI
        run: |
          sqlpackage /Action:Publish \
            /SourceFile:base-out/MyApplication.Database.dacpac \
            /TargetServerName:localhost \
            /TargetDatabaseName:MyApplicationDb \
            /TargetUser:sa \
            /TargetPassword:"$SA_PASSWORD" \
            /TargetTrustServerCertificate:true

      - name: Generate this PR's diff script against that baseline
        env:
          SA_PASSWORD: SchemaDiffPreview!CI
        run: |
          sqlpackage /Action:Script \
            /SourceFile:pr-out/MyApplication.Database.dacpac \
            /TargetServerName:localhost \
            /TargetDatabaseName:MyApplicationDb \
            /TargetUser:sa \
            /TargetPassword:"$SA_PASSWORD" \
            /TargetTrustServerCertificate:true \
            /OutputPath:schema-diff.sql

      - name: Upload diff script as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-diff
          path: schema-diff.sql
          if-no-files-found: ignore

      - name: Build PR comment body
        if: always()
        run: |
          {
            echo "### Schema diff preview"
            echo
            echo "What deploying \`src/MyApplication.Database\` from this branch would run against a database currently on \`${{ github.event.pull_request.base.ref }}\`'s schema — generated by \`sqlpackage /Action:Script\`, not executed."
            echo
            if [ -s schema-diff.sql ]; then
              echo "<details>"
              echo "<summary>Generated deploy script</summary>"
              echo
              echo '```sql'
              head -c 60000 schema-diff.sql
              if [ "$(wc -c < schema-diff.sql)" -gt 60000 ]; then
                echo
                echo "-- (truncated — see the schema-diff build artifact for the full script)"
              fi
              echo '```'
              echo "</details>"
            else
              echo "_Diff generation failed or produced no output — check the workflow run._"
            fi
          } > schema-diff-comment.md

      - name: Post or update the sticky PR comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: schema-diff-preview
          path: schema-diff-comment.md
