services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.database
      args:
        SCHEMA_VERSION: ${SCHEMA_VERSION:-dev}
    image: myapp-db:${SCHEMA_VERSION:-dev}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      DATABASE_NAME: "MyApplicationDb"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -N -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -N -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: myapp-web:${APP_VERSION:-dev}
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=MyApplicationDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True"
      ASPNETCORE_ENVIRONMENT: "Production"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql-data:
